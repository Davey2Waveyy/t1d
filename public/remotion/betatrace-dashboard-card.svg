<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">BetaTrace dashboard preview</title>
  <desc id="desc">Dark dashboard interface with glucose, time in range, insulin, carbs, trend chart, assistant, and insights.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17352b"/>
      <stop offset="1" stop-color="#0b1713"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2dd4a8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="900" height="560" rx="34" fill="#08120f"/>
  <rect x="28" y="28" width="844" height="504" rx="26" fill="url(#panel)" filter="url(#shadow)"/>

  <g transform="translate(60 58)">
    <circle cx="18" cy="18" r="18" fill="#2dd4a8"/>
    <path d="M18 7c-4 5-6 10-6 15 0 4 3 7 6 7s6-3 6-7c0-5-2-10-6-15Z" fill="#0d1b16"/>
    <text x="52" y="25" fill="#e8f5f0" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">BetaTrace</text>
    <text x="52" y="52" fill="#6b8a80" font-family="Inter, Arial, sans-serif" font-size="16">Command center</text>
  </g>

  <g transform="translate(60 138)">
    <rect width="176" height="100" rx="18" fill="#10251f" stroke="#2dd4a8" stroke-opacity=".18"/>
    <text x="20" y="33" fill="#6b8a80" font-family="Inter, Arial, sans-serif" font-size="15">Current glucose</text>
    <text x="20" y="75" fill="#e8f5f0" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700">112</text>
    <text x="95" y="74" fill="#2dd4a8" font-family="Inter, Arial, sans-serif" font-size="16">mg/dL</text>

    <rect x="196" width="176" height="100" rx="18" fill="#10251f" stroke="#10b981" stroke-opacity=".18"/>
    <text x="216" y="33" fill="#6b8a80" font-family="Inter, Arial, sans-serif" font-size="15">Time in range</text>
    <text x="216" y="75" fill="#e8f5f0" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700">72%</text>

    <rect x="392" width="176" height="100" rx="18" fill="#10251f" stroke="#38bdf8" stroke-opacity=".18"/>
    <text x="412" y="33" fill="#6b8a80" font-family="Inter, Arial, sans-serif" font-size="15">Active insulin</text>
    <text x="412" y="75" fill="#e8f5f0" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700">1.8u</text>

    <rect x="588" width="176" height="100" rx="18" fill="#10251f" stroke="#fbbf24" stroke-opacity=".18"/>
    <text x="608" y="33" fill="#6b8a80" font-family="Inter, Arial, sans-serif" font-size="15">Carbs today</text>
    <text x="608" y="75" fill="#e8f5f0" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="700">86g</text>
  </g>

  <g transform="translate(60 270)">
    <rect width="500" height="194" rx="22" fill="#10251f" stroke="#2dd4a8" stroke-opacity=".14"/>
    <text x="24" y="38" fill="#e8f5f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">48-hour glucose trace</text>
    <line x1="34" y1="74" x2="468" y2="74" stroke="#fbbf24" stroke-opacity=".36" stroke-dasharray="6 8"/>
    <line x1="34" y1="148" x2="468" y2="148" stroke="#fb7185" stroke-opacity=".36" stroke-dasharray="6 8"/>
    <path d="M34 132 C76 122 90 86 130 96 C175 108 187 62 231 72 C278 82 284 116 328 104 C369 92 386 44 424 59 C446 68 459 76 468 72" fill="none" stroke="url(#trace)" stroke-width="6" stroke-linecap="round"/>
    <path d="M34 132 C76 122 90 86 130 96 C175 108 187 62 231 72 C278 82 284 116 328 104 C369 92 386 44 424 59 C446 68 459 76 468 72 L468 172 L34 172Z" fill="#2dd4a8" opacity=".08"/>
  </g>

  <g transform="translate(590 270)">
    <rect width="250" height="194" rx="22" fill="#10251f" stroke="#a78bfa" stroke-opacity=".14"/>
    <text x="24" y="38" fill="#e8f5f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">AI copilot</text>
    <rect x="24" y="62" width="182" height="45" rx="16" fill="#183c32"/>
    <text x="42" y="90" fill="#c8f7e9" font-family="Inter, Arial, sans-serif" font-size="15">What changed after dinner?</text>
    <rect x="44" y="122" width="182" height="48" rx="16" fill="#1f2738"/>
    <text x="62" y="151" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="15">Meals and timing stand out.</text>
  </g>
</svg>
